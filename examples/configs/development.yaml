version: v1

features:
  new_checkout:
    enabled: true
    rollout_percentage: 100
    conditions:
      countries:
        - IN
        - US

  admin_dashboard:
    enabled: true
    rollout_percentage: 50
    conditions:
      roles:
        - admin

security:
  routes:
    - name: public-health
      path: /health
      methods:
        - GET
      require_authentication: false

    - name: api-products
      path: /api/products/*
      methods:
        - GET
      require_authentication: false

    - name: create-payment
      path: /api/payments/*
      methods:
        - POST
      require_authentication: true
      allowed_roles:
        - customer
        - admin
      rate_limit:
        requests: 200
        window: 1m

    - name: admin-reports
      path: /api/admin/*
      methods:
        - GET
      require_authentication: true
      allowed_roles:
        - admin

privacy:
  redact_headers:
    - authorization
  redact_query_parameters:
    - password
  redact_json_fields:
    - password

logging:
  level: debug
  include_request_id: true