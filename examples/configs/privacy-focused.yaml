version: v1

features:
  new_checkout:
    enabled: false
    rollout_percentage: 0

security:
  routes:
    - name: public-health
      path: /health
      methods:
        - GET
      require_authentication: false

    - name: api-products
      path: /api/products/*
      methods:
        - GET
      require_authentication: true
      allowed_roles:
        - customer
        - admin
      rate_limit:
        requests: 50
        window: 1m

    - name: create-payment
      path: /api/payments/*
      methods:
        - POST
      require_authentication: true
      allowed_roles:
        - customer
        - admin
      rate_limit:
        requests: 20
        window: 1m

    - name: admin-reports
      path: /api/admin/*
      methods:
        - GET
      require_authentication: true
      allowed_roles:
        - admin
      rate_limit:
        requests: 10
        window: 1m

privacy:
  redact_headers:
    - authorization
    - cookie
    - x-api-key
    - x-forwarded-for
  redact_query_parameters:
    - password
    - token
    - api_key
    - session
  redact_json_fields:
    - password
    - access_token
    - credit_card.number
    - credit_card.cvv
    - session_id

logging:
  level: warn
  include_request_id: true