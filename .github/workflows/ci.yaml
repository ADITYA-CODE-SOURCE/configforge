name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go module cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-${{ matrix.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ matrix.go-version }}-

      - name: Install dependencies
        run: go mod download

      - name: gofmt check
        run: |
          missing=$(gofmt -l .)
          if [ -n "$missing" ]; then
            echo "gofmt issues in:$missing"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Go test (no race)
        run: go test -count=1 ./...

      - name: Go test with race detector
        run: go test -race -count=1 ./...

      - name: Verify generated files
        run: |
          go test ./...
          git diff --exit-code

      - name: Build CLI
        run: go build -o configforge ./cmd/configforge

      - name: Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          tags: configforge:${{ matrix.go-version }}

      - name: Coverage report
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out